# Set prefix key to ctrl-a instead of ctrl-b
set -g prefix C-a
bind C-a send-prefix
unbind C-b

# Cheat Sheet
bind-key -r i run-shell "tmux neww ~/.config/tmux/chtsh/cht.sh"

# Sessionizer
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

# Enable 256 color support
# set-option -g default-terminal "screen-256color"
set -g default-terminal "xterm-256color"
set-option -sa terminal-overrides ',xterm-256color:RGB'

# Enable mouse scrolling
set -g mouse on

# Start window indexing at 1
set -g base-index 1

# Recommended settings from nvim checkhealth
set-option -sg escape-time 10
set-option -g focus-events on
# set-option -sa terminal-overrides ',alacritty:RGB'

## COLORSCHEME: Rosé Pine
set-option -g status "on"

# default statusbar — overlay bg, text fg
set-option -g status-style bg='#26233a',fg='#e0def4'

# default window title — muted bg, overlay fg
set-window-option -g window-status-style bg='#1f1d2e',fg='#6e6a86'

# window with activity alert — subtle highlight
set-window-option -g window-status-activity-style bg='#26233a',fg='#908caa'

# active window title — love accent
set-window-option -g window-status-current-style bg='#eb6f92',fg='#191724'

# pane borders
set-option -g pane-active-border-style fg='#908caa'
set-option -g pane-border-style fg='#26233a'

# message infos — overlay bg, text fg
set-option -g message-style bg='#26233a',fg='#e0def4'

# writing commands inactive
set-option -g message-command-style bg='#26233a',fg='#908caa'

# pane number display
set-option -g display-panes-active-colour '#908caa'
set-option -g display-panes-colour '#26233a'

# clock
set-window-option -g clock-mode-colour '#31748f'

# bell
set-window-option -g window-status-bell-style bg='#eb6f92',fg='#191724'

## Status bar layout
set-option -g status-justify "left"
set-option -g status-left-style none
set-option -g status-left-length "80"
set-option -g status-right-style none
set-option -g status-right-length "80"
set-window-option -g window-status-separator ""

# left: session name — iris on surface
set-option -g status-left "#[bg=#403d52,fg=#c4a7e7] #S #[bg=#26233a,fg=#403d52,nobold,noitalics,nounderscore]"

# right: date/time + hostname — subtle tones
set-option -g status-right "#[bg=#26233a,fg=#1f1d2e,nobold,nounderscore,noitalics]#[bg=#1f1d2e,fg=#6e6a86] %Y-%m-%d  %H:%M #[bg=#1f1d2e,fg=#908caa,nobold,noitalics,nounderscore]#[bg=#908caa,fg=#191724] #h "

# active window — foam accent (softer than love for readability)
set-window-option -g window-status-current-format "#[bg=#9ccfd8,fg=#26233a,nobold,noitalics,nounderscore]#[bg=#9ccfd8,fg=#191724] #I #[bg=#9ccfd8,fg=#191724,bold] #W#{?window_zoomed_flag,*Z,} #[bg=#26233a,fg=#9ccfd8,nobold,noitalics,nounderscore]"

# inactive windows — subtle on overlay
set-window-option -g window-status-format "#[bg=#1f1d2e,fg=#26233a,noitalics]#[bg=#1f1d2e,fg=#6e6a86] #I #[bg=#1f1d2e,fg=#6e6a86] #W #[bg=#26233a,fg=#1f1d2e,noitalics]"

# vim: set ft=tmux tw=0 nowrap:
